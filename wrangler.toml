name = "stellardragoon"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# @sveltejs/adapter-cloudflare emits the Worker entry and static assets here.
main = ".svelte-kit/cloudflare/_worker.js"

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[observability]
enabled = true
