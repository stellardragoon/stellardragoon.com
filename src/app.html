<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Google Fonts: JP equivalents for 幻ノにじみ明朝 / Yu Gothic UI / ラノベPOP v2 -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap"

	</head>
	<!--the "h-full" fixes tailwind :/ -->
	<body data-sveltekit-preload-data="hover" class="h-full">

		<div style="display: contents">%sveltekit.body%</div>
